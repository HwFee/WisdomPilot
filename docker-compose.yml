# ============================================
# 智码领航 - Docker Compose 配置
# ============================================
# 适用于华为云服务器部署
# 使用方式: docker-compose up -d
# 注意: 使用 SQLite 单实例部署，不支持水平扩展
# ============================================

version: "3.8"

services:
  # 后端服务（单实例，SQLite 不支持多写入者）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicoding-backend
    restart: always
    environment:
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - AI_BASE_URL=${AI_BASE_URL}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-MiniMax-M2.7}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-siliconflow}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-large-zh-v1.5}
      - JUDGE0_BASE_URL=${JUDGE0_BASE_URL:-https://ce.judge0.com}
      - ENABLE_TEST_SANDBOX=false
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - DATABASE_URL=sqlite+aiosqlite:///./data/data.db
    volumes:
      - ./data:/app/data
      - ./backend/exercises:/app/exercises
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicoding-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://api.你的域名.com
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  data:
