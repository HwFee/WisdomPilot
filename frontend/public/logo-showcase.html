<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智码领航 — Logo Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', 'PingFang SC', sans-serif; }
        .logo-glow { filter: drop-shadow(0 0 12px rgba(59,130,246,0.3)); }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-200">

    <div class="max-w-5xl mx-auto px-6 py-16">

        <!-- Header -->
        <div class="text-center mb-16">
            <h1 class="text-4xl font-bold mb-3">
                <span class="bg-gradient-to-r from-blue-400 to-cyan-300 bg-clip-text text-transparent">
                    智码领航
                </span>
            </h1>
            <p class="text-slate-500 text-sm">基于生成式AI的程序设计类课程实践教学系统</p>
        </div>

        <!-- Primary Logo -->
        <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-12 mb-10">
            <p class="text-xs font-mono text-slate-600 uppercase tracking-widest mb-8 text-center">Primary Logo / 主标识</p>
            <div class="flex flex-col md:flex-row items-center justify-center gap-16">
                <!-- Dark -->
                <div class="flex flex-col items-center gap-4">
                    <div class="w-28 h-28 logo-glow">
                        <svg viewBox="0 0 40 40" fill="none" class="w-full h-full">
                            <circle cx="20" cy="20" r="18" fill="#3b82f6"/>
                            <circle cx="20" cy="20" r="18" fill="url(#shine)" opacity="0.15"/>
                            <path d="M16 14 L11 20 L16 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
                            <path d="M24 14 L29 20 L24 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
                            <circle cx="20" cy="20" r="3" fill="white"/>
                            <radialGradient id="shine" cx="30%" cy="25%" r="60%">
                                <stop offset="0%" stop-color="white" stop-opacity="1"/>
                                <stop offset="100%" stop-color="white" stop-opacity="0"/>
                            </radialGradient>
                        </svg>
                    </div>
                    <span class="text-xs text-slate-500">Dark / 深色模式</span>
                </div>
                <!-- Light -->
                <div class="flex flex-col items-center gap-4 bg-white rounded-xl p-8">
                    <div class="w-28 h-28">
                        <svg viewBox="0 0 40 40" fill="none" class="w-full h-full">
                            <circle cx="20" cy="20" r="18" fill="#2563eb"/>
                            <circle cx="20" cy="20" r="18" fill="url(#shine-light)" opacity="0.12"/>
                            <path d="M16 14 L11 20 L16 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
                            <path d="M24 14 L29 20 L24 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
                            <circle cx="20" cy="20" r="3" fill="white"/>
                            <radialGradient id="shine-light" cx="30%" cy="25%" r="60%">
                                <stop offset="0%" stop-color="white" stop-opacity="1"/>
                                <stop offset="100%" stop-color="white" stop-opacity="0"/>
                            </radialGradient>
                        </svg>
                    </div>
                    <span class="text-xs text-slate-400">Light / 浅色模式</span>
                </div>
            </div>
            <p class="text-center text-slate-500 text-sm mt-8 max-w-md mx-auto">
                实心蓝色圆盘 + 白色代码括号 + 中心光点<br>
                像一枚徽章，在导航栏里有足够的存在感
            </p>
        </div>

        <!-- Size Variants -->
        <div class="grid grid-cols-3 gap-5 mb-10">
            <div class="bg-slate-900/40 border border-slate-800 rounded-xl p-6 flex flex-col items-center">
                <p class="text-[10px] font-mono text-slate-600 uppercase tracking-widest mb-4">Favicon 16×16</p>
                <svg width="16" height="16" viewBox="0 0 40 40">
                    <circle cx="20" cy="20" r="18" fill="#3b82f6"/>
                    <path d="M16 14 L11 20 L16 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M24 14 L29 20 L24 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="20" cy="20" r="3" fill="white"/>
                </svg>
            </div>
            <div class="bg-slate-900/40 border border-slate-800 rounded-xl p-6 flex flex-col items-center">
                <p class="text-[10px] font-mono text-slate-600 uppercase tracking-widest mb-4">Nav 32×32</p>
                <svg width="32" height="32" viewBox="0 0 40 40">
                    <circle cx="20" cy="20" r="18" fill="#3b82f6"/>
                    <path d="M16 14 L11 20 L16 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M24 14 L29 20 L24 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="20" cy="20" r="3" fill="white"/>
                </svg>
            </div>
            <div class="bg-slate-900/40 border border-slate-800 rounded-xl p-6 flex flex-col items-center">
                <p class="text-[10px] font-mono text-slate-600 uppercase tracking-widest mb-4">App 64×64</p>
                <svg width="64" height="64" viewBox="0 0 40 40">
                    <circle cx="20" cy="20" r="18" fill="#3b82f6"/>
                    <circle cx="20" cy="20" r="18" fill="url(#s)" opacity="0.15"/>
                    <path d="M16 14 L11 20 L16 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
                    <path d="M24 14 L29 20 L24 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
                    <circle cx="20" cy="20" r="3" fill="white"/>
                    <radialGradient id="s" cx="30%" cy="25%" r="60%"><stop offset="0%" stop-color="white" stop-opacity="1"/><stop offset="100%" stop-color="white" stop-opacity="0"/></radialGradient>
                </svg>
            </div>
        </div>

        <!-- In Context -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-10">
            <div class="bg-slate-900/40 border border-slate-800 rounded-xl p-5">
                <p class="text-[10px] font-mono text-slate-600 uppercase tracking-widest mb-4">Navbar / 导航栏</p>
                <div class="flex items-center gap-3">
                    <svg width="32" height="32" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#3b82f6"/><path d="M16 14 L11 20 L16 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 14 L29 20 L24 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="20" r="3" fill="white"/></svg>
                    <span class="font-semibold text-slate-200">智码领航</span>
                </div>
            </div>
            <div class="bg-white rounded-xl p-5">
                <p class="text-[10px] font-mono text-slate-400 uppercase tracking-widest mb-4">Light Nav / 浅色导航</p>
                <div class="flex items-center gap-3">
                    <svg width="32" height="32" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#2563eb"/><path d="M16 14 L11 20 L16 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 14 L29 20 L24 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="20" r="3" fill="white"/></svg>
                    <span class="font-semibold text-slate-800">智码领航</span>
                </div>
            </div>
        </div>

        <!-- Color -->
        <div class="bg-slate-900/40 border border-slate-800 rounded-xl p-6">
            <p class="text-[10px] font-mono text-slate-600 uppercase tracking-widest mb-6 text-center">Color / 品牌色</p>
            <div class="flex justify-center gap-6">
                <div class="text-center"><div class="w-12 h-12 rounded-lg bg-blue-500 mb-2"></div><span class="text-xs text-slate-500">#3B82F6</span></div>
                <div class="text-center"><div class="w-12 h-12 rounded-lg bg-blue-600 mb-2"></div><span class="text-xs text-slate-500">#2563EB</span></div>
                <div class="text-center"><div class="w-12 h-12 rounded-lg bg-white border border-slate-700 mb-2"></div><span class="text-xs text-slate-500">#FFFFFF</span></div>
            </div>
        </div>

    </div>
</body>
</html>
