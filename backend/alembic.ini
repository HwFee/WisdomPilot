# Alembic Configuration

[alembic]
# Migration script directory
script_location = migrations

# Database URL (overridden dynamically from app.config)
sqlalchemy.url = sqlite+aiosqlite:///./data.db

# Template
# file_template = %%(rev)s_%%(slug)s

# Timezone
timezone = Asia/Shanghai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
