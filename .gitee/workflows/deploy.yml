# ============================================
# Gitee Actions - 自动部署到华为云
# ============================================
# 触发条件: 推送到 main 分支
# 功能: 自动拉取代码并执行部署脚本
# ============================================

name: 自动部署到华为云

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 部署到华为云服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          script: |
            cd /opt/AI-Tutorial
            ./deploy.sh
