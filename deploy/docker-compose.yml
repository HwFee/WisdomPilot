version: "3.8"

services:
  backend:
    image: aicoding-backend:v2
    container_name: aicoding-backend
    restart: always
    environment:
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - AI_PROVIDER=${AI_PROVIDER:-siliconflow}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-Qwen/Qwen2.5-72B-Instruct}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.siliconflow.cn/v1}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-MiniMax-M2.7}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-siliconflow}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-large-zh-v1.5}
      - JUDGE0_BASE_URL=${JUDGE0_BASE_URL:-https://ce.judge0.com}
      - ENABLE_TEST_SANDBOX=false
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - DATABASE_URL=sqlite+aiosqlite:///./data/data.db
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    networks:
      - app-network

  frontend:
    image: aicoding-frontend:v1
    container_name: aicoding-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
