# ============================================
# 智码领航 - Docker Compose 配置
# ============================================
# 华为云服务器部署（无域名版本）
# 使用方式: docker-compose up -d
# ============================================

version: "3.8"

services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicoding-backend
    restart: always
    environment:
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - AI_PROVIDER=siliconflow
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-Qwen/Qwen2.5-72B-Instruct}
      - AI_BASE_URL=https://api.siliconflow.cn/v1
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-MiniMax-M2.7}
      - EMBEDDING_PROVIDER=siliconflow
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-${AI_API_KEY}}
      - EMBEDDING_BASE_URL=https://api.siliconflow.cn/v1
      - EMBEDDING_MODEL=BAAI/bge-large-zh-v1.5
      - JUDGE0_BASE_URL=${JUDGE0_BASE_URL:-https://ce.judge0.com}
      - ENABLE_TEST_SANDBOX=false
      - CORS_ORIGINS=${CORS_ORIGINS}
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://115.175.38.106:8000}
    container_name: aicoding-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
