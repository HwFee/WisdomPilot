name: Build and Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository_owner }}/aicoding-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository_owner }}/aicoding-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "=== Logging in to GitHub Container Registry ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "=== Pulling latest images ==="
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest

            echo "=== Stopping old containers ==="
            docker stop aicoding-backend aicoding-frontend 2>/dev/null || true
            docker rm aicoding-backend aicoding-frontend 2>/dev/null || true

            echo "=== Starting backend ==="
            docker run -d \
              --name aicoding-backend \
              --restart always \
              -p 8000:8000 \
              -e SECRET_KEY="${SECRET_KEY}" \
              -e AI_API_KEY="${AI_API_KEY}" \
              -e AI_PROVIDER="${AI_PROVIDER:-siliconflow}" \
              -e AI_MODEL="${AI_MODEL:-Qwen/Qwen2.5-72B-Instruct}" \
              -e AI_BASE_URL="${AI_BASE_URL:-https://api.siliconflow.cn/v1}" \
              -e JUDGE0_BASE_URL="${JUDGE0_BASE_URL:-https://ce.judge0.com}" \
              -e ENABLE_TEST_SANDBOX=false \
              -e CORS_ORIGINS="${CORS_ORIGINS}" \
              -v /opt/data:/app/data \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest

            echo "=== Waiting for backend ==="
            sleep 5

            echo "=== Starting frontend ==="
            docker run -d \
              --name aicoding-frontend \
              --restart always \
              -p 3000:3000 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest

            echo "=== Verifying ==="
            sleep 3
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            curl -sf http://localhost:8000/health && echo " - Backend OK" || echo " - Backend FAILED"
            echo ""
            echo "=== Deploy complete ==="

      - name: Summary
        run: |
          echo "### Build & Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Deployed to: \`${{ secrets.SERVER_IP }}\`" >> $GITHUB_STEP_SUMMARY
