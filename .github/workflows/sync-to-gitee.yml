name: 自动同步到 Gitee

on:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送到 Gitee
        uses: wearerequired/git-mirror-action@v1
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_TOKEN }}
        with:
          source-repo: "https://github.com/HwFee/AlcodiingTeach-demo.git"
          destination-repo: "https://gitee.com/dongyanchang/AlcodiingTeach-demo.git"
