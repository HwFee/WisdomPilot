name: 自动同步到 Gitee

on:
  push:
    branches: [ main, master ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送到 Gitee
        run: |
          git config --global user.name "自动同步"
          git config --global user.email "action@github.com"
          git remote set-url gitee https://${{ secrets.GITEE_TOKEN }}@gitee.com/dongyanchang/AlcodiingTeach-demo.git || git remote add gitee https://${{ secrets.GITEE_TOKEN }}@gitee.com/dongyanchang/AlcodiingTeach-demo.git
          git push --force-with-lease gitee HEAD:main
